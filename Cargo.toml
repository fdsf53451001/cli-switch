[package]
name = "cli-switch"
version = "0.2.0"
edition = "2021"
description = "Sync MCP servers, skills, and instructions across AI CLIs (Claude Code, Codex, opencode, Kiro, Antigravity, GitHub Copilot)"
repository = "https://github.com/fdsf53451001/cli-switch"
readme = "README.md"
license = "MIT"

[[bin]]
name = "cli-switch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
