name: release

# Push a version tag to build cross-platform binaries and publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  build:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest } # Apple Silicon
          - { target: x86_64-apple-darwin, os: macos-13 } # Intel Mac
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest } # static Linux
          - { target: x86_64-pc-windows-msvc, os: windows-latest } # Windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          src="target/${{ matrix.target }}/release/cli-switch${ext}"
          dst="cli-switch-${{ matrix.target }}${ext}"
          cp "$src" "$dst"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dst" > "$dst.sha256"
          else
            shasum -a 256 "$dst" > "$dst.sha256"
          fi
          echo "ASSET=$dst" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
